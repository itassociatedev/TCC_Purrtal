name: Deploy to Production

# This triggers the action whenever you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/tccpurrtal/htdocs/www.tccpurrtal.tech/TCC_Purrtal
            
            # 1. Force the site back online immediately (ignore if it fails)
            php artisan up || true

            # 2. Fetch the absolute latest data from GitHub
            git fetch origin main

            # 3. Force the server to perfectly match GitHub (This restores deploy.sh!)
            git reset --hard origin/main

            # 4. Make it executable and run it!
            chmod +x deploy.sh
            ./deploy.sh
