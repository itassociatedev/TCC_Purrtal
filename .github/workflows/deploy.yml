name: Deploy to Production

# This triggers the action whenever you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/tccpurrtal/htdocs/www.tccpurrtal.tech/TCC_Purrtal
            
            # 1. Force the site back online immediately (ignore if it fails)
            php artisan up || true
            
            # 2. Destroy the old, conflicting deploy script
            rm -f deploy.sh
            
            # 3. Pull the new bulletproof script we made earlier
            git pull origin main
            
            # 4. Make it executable and run it!
            chmod +x deploy.sh
            ./deploy.sh
